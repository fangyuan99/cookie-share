name: Security compatibility review

on:
  push:
    branches: [feat/security-compat-hardening]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.tar
          retention-days: 1
