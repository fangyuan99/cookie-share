name: Validate dependency security refresh

on:
  push:
    branches: [feat/security-compat-hardening]
    paths:
      - .github/workflows/apply-security-upgrade.yml

permissions:
  contents: write

concurrency:
  group: apply-security-compat-hardening
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.repository == 'fangyuan99/cookie-share' && github.ref == 'refs/heads/feat/security-compat-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh Worker lockfile within existing version ranges
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=moderate
      - name: Validate Worker source and protocol compatibility
        run: |
          npm run test:security
          npm test
          npm run check
      - name: Upgrade vulnerable Node test runner and refresh transitive dependencies
        working-directory: server
        run: |
          npm ci
          npm install --save-dev 'vitest@^4.1.11'
          npm audit fix
          npm audit --audit-level=moderate
          npm run build
          npm test
          npm exec --yes --package=pnpm@10 -- pnpm import
      - name: Record tested dependency versions
        run: |
          npm ls --depth=0
          (cd server && npm ls --depth=0)
          node --check _worker.js
          node --check tampermonkey/cookie-share.user.js
          git diff --check
      - name: Commit validated dependency files to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/security-compat-hardening
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REMOTE_HEAD=$(git -c http.extraheader="$AUTH" ls-remote origin refs/heads/feat/security-compat-hardening | cut -f1)
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git add package.json package-lock.json server/package.json server/package-lock.json server/pnpm-lock.yaml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): update vulnerable tooling and synchronize package lockfiles'
          git -c http.extraheader="$AUTH" push origin HEAD:refs/heads/feat/security-compat-hardening
          printf 'Validated dependency commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
